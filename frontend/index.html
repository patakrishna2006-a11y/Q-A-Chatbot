<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">

  <!-- Apply saved theme before paint to avoid a flash -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <span class="spark" aria-hidden="true"></span>
        <h1>Chatbot</h1>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="newChatBtn" aria-label="New chat" title="New chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="chat-container" id="chatContainer">
      <div class="thread" id="thread">

        <section class="welcome" id="welcome">
          <h2 class="welcome-title">Hello there</h2>
          <p class="welcome-sub">How can I help you today?</p>
          <div class="chips">
            <button class="chip" data-prompt="Explain how REST and GraphQL differ, with a comparison table.">Compare REST and GraphQL</button>
            <button class="chip" data-prompt="Write a Python function to merge two sorted lists, with comments.">Write a Python function</button>
            <button class="chip" data-prompt="Give me a 3-day study plan for learning SQL, as a table.">Plan a study schedule</button>
            <button class="chip" data-prompt="Summarize the pros and cons of microservices.">Pros and cons of microservices</button>
          </div>
        </section>

        <div class="messages" id="messages" aria-live="polite"></div>
      </div>
    </main>

    <footer class="composer-wrap">
      <button class="scroll-down" id="scrollDown" aria-label="Scroll to latest message" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      </button>
      <form class="composer" id="inputForm">
        <textarea class="input-field" id="inputField" rows="1" placeholder="Ask anything" aria-label="Message input"></textarea>
        <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
        <button type="button" class="stop-btn" id="stopBtn" aria-label="Stop generating" title="Stop" hidden>
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </form>
      <p class="input-hint">Enter to send · Shift+Enter for a new line</p>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
